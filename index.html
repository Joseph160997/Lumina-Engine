<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Básico -->
    <title>Lumina Engine | Buscador de Películas - TMDB</title>
    <meta
      name="description"
      content="Explora, descubre y guarda tus películas favoritas. Buscador de cine con datos de TMDB. Sinopsis, reparto, trailers y más."
    />
    <meta name="author" content="Joseph Ortega" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lumina-engine-kappa.vercel.app/" />

    <!-- Theme color para móviles (barra del navegador) -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicon + Apple touch icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumina Engine | Buscador de Películas" />
    <meta
      property="og:description"
      content="Explora, descubre y guarda tus películas favoritas en una experiencia cinematográfica inmersiva."
    />
    <meta
      property="og:image"
      content="https://lumina-engine-kappa.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://lumina-engine-kappa.vercel.app/" />
    <meta property="og:site_name" content="Lumina Engine" />
    <meta property="og:locale" content="es_ES" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Lumina Engine | Buscador de Películas"
    />
    <meta
      name="twitter:description"
      content="Explora, descubre y guarda tus películas favoritas."
    />
    <meta
      name="twitter:image"
      content="https://lumina-engine-kappa.vercel.app/og-image.png"
    />

    <!-- Preconnect para rendimiento -->
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- Fuentes: Bebas Neue (display/títulos) + Manrope (cuerpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col">
    <!-- ═══════════════════════════════════════════════════════════
         NAVBAR — Único nav. Paleta ámbar (marquesina de cine).
         ═══════════════════════════════════════════════════════════ -->
    <nav
      class="fixed top-0 left-0 right-0 z-40 border-b border-white/5 bg-slate-950/70 backdrop-blur-xl"
    >
      <div
        class="container mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4"
      >
        <!-- Logo -->
        <a href="#" class="flex items-center gap-2.5 shrink-0 group">
          <span
            class="text-2xl transition-transform duration-300 group-hover:-rotate-12"
            >🎬</span
          >
          <span class="font-display text-2xl tracking-widest text-amber-400">
            LUMINA
          </span>
        </a>

        <!-- Búsqueda (centro, crece en desktop) -->
        <form id="search-form" class="flex-1 max-w-xl flex items-center gap-2">
          <div class="relative w-full group">
            <span
              class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-amber-400 transition-colors pointer-events-none"
            >
              <svg
                class="w-4.5 h-4.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"
                />
              </svg>
            </span>
            <input
              type="text"
              id="search-input"
              placeholder="Buscar películas..."
              autocomplete="off"
              class="w-full h-10 pl-10 pr-4 rounded-xl bg-white/5 border border-white/10 text-sm font-medium placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-400/50 focus:bg-white/10 transition-all duration-300"
            />
          </div>
          <button
            type="submit"
            class="hidden sm:flex h-10 px-5 items-center justify-center rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-sm font-bold shadow-lg shadow-amber-400/20 active:scale-95 transition-all duration-200 whitespace-nowrap cursor-pointer"
          >
            Buscar
          </button>
        </form>

        <!-- Acciones (derecha) -->
        <div class="flex items-center gap-2 shrink-0">
          <!-- ✅ CAMBIO: Agregado `flex` a la clase.
               ¿Por qué? refreshFavoritesButton() hace classList.remove("hidden")
               para mostrar este botón. Sin `flex`, al quitar `hidden` el botón
               queda sin display:flex y los hijos (❤️ + texto) no se alinean.
               Tailwind v4: `items-center` NO implica `display:flex`. -->
          <button
            type="button"
            id="btn-favorites"
            class="hidden flex items-center gap-1.5 h-10 px-4 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 hover:border-white/20 transition-all duration-200 cursor-pointer"
          >
            <span class="text-base">❤️</span>
            <span class="hidden md:inline">Favoritos</span>
          </button>

          <!-- ✅ CAMBIO: Mismo fix — agregado `flex` -->
          <button
            type="button"
            id="btn-back"
            class="hidden flex items-center gap-1.5 h-10 px-4 rounded-xl bg-amber-400/10 border border-amber-400/30 text-sm font-semibold text-amber-300 hover:text-white hover:bg-amber-400/25 transition-all duration-200 cursor-pointer"
          >
            <span class="text-base">←</span>
            <span class="hidden md:inline">Volver</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- ═══════════════════════════════════════════════════════════
         HERO — Backdrop rotatorio de películas en tendencia.
         Sin cambios respecto a lo que ya tenías.
    ═══════════════════════════════════════════════════════════ -->
    <header
      id="hero"
      class="film-grain relative min-h-[82vh] flex items-end overflow-hidden"
    >
      <!-- Capas de backdrop (crossfade A/B) -->
      <img id="hero-bg-a" alt="" aria-hidden="true" class="hero-bg" />
      <img id="hero-bg-b" alt="" aria-hidden="true" class="hero-bg" />

      <!-- Scrims para legibilidad (degradados funcionales, no decorativos) -->
      <div
        class="absolute inset-0 bg-linear-to-r from-slate-950 via-slate-950/75 to-slate-950/10"
      ></div>
      <div
        class="absolute inset-0 bg-linear-to-t from-slate-950 via-slate-950/20 to-slate-950/40"
      ></div>

      <!-- Contenido anclado a la izquierda, como afiche -->
      <div
        class="relative z-10 container mx-auto px-4 sm:px-6 pt-32 pb-16 sm:pb-20"
      >
        <div id="hero-copy" class="hero-copy max-w-2xl">
          <p
            class="flex items-center gap-2 text-[11px] sm:text-xs font-bold uppercase tracking-[0.35em] text-amber-400 mb-4"
          >
            <span class="inline-block w-8 h-px bg-amber-400"></span>
            Destacado esta semana
          </p>

          <h1
            id="hero-title"
            class="font-display text-6xl sm:text-7xl lg:text-8xl leading-[0.95] text-slate-50 mb-4 drop-shadow-lg"
          >
            &nbsp;
          </h1>

          <div
            id="hero-meta"
            class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm font-semibold text-slate-200 mb-4"
          ></div>

          <p
            id="hero-overview"
            class="text-slate-300/90 text-sm sm:text-base leading-relaxed max-w-xl mb-7 line-clamp-3"
          ></p>

          <div class="flex flex-wrap items-center gap-3">
            <button
              type="button"
              id="hero-cta"
              class="px-7 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm shadow-lg shadow-amber-400/25 active:scale-95 transition-all duration-200 cursor-pointer"
            >
              ▶ Ver detalles
            </button>
            <button
              type="button"
              id="hero-fav"
              class="flex items-center gap-2 px-6 py-3 rounded-xl border border-amber-400 text-amber-300 hover:bg-amber-400/10 font-bold text-sm transition-all duration-200 cursor-pointer"
            >
              <span class="hero-fav-icon text-base">🤍</span>
              <span class="hero-fav-label">Agregar a favoritos</span>
            </button>
          </div>
        </div>

        <!-- Indicadores de cartelera -->
        <div class="mt-10 flex items-center gap-3">
          <span class="font-display tracking-[0.25em] text-xs text-slate-500"
            >CARTELERA</span
          >
          <div id="hero-ticks" class="flex items-center gap-2"></div>
        </div>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════
         MAIN — Grid de resultados de búsqueda.
         Sin cambios.
    ═══════════════════════════════════════════════════════════ -->
    <main class="flex-1">
      <div class="container mx-auto px-4 sm:px-6 pb-20">
        <!-- Encabezado de sección -->
        <div class="flex items-center gap-3 mb-8">
          <div class="w-1 h-7 rounded-full bg-amber-400"></div>
          <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">
            Resultados
          </h2>
        </div>

        <!-- Grid de películas -->
        <div
          id="movie-grid"
          class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6"
        ></div>
      </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════════
         FOOTER — Sin cambios por ahora (la paleta se unifica en Fase 2).
    ═══════════════════════════════════════════════════════════ -->
    <footer class="border-t border-white/5 bg-slate-950">
      <div class="container mx-auto px-4 sm:px-6 py-10">
        <div
          class="flex flex-col sm:flex-row items-center justify-between gap-6"
        >
          <!-- Logo + tagline -->
          <div class="flex items-center gap-2.5">
            <span class="text-xl">⚡</span>
            <!-- DESPUÉS (sólido ámbar + tipografía de marquesina, igual que el nav) -->
            <span class="font-display text-2xl tracking-widest text-amber-400">
              LUMINA ENGINE
            </span>
          </div>

          <!-- Tech stack -->
          <div class="flex items-center gap-4 text-slate-600 text-sm">
            <span class="hover:text-slate-400 transition-colors"
              >TypeScript</span
            >
            <span class="text-slate-800">•</span>
            <span class="hover:text-slate-400 transition-colors">Vite</span>
            <span class="text-slate-800">•</span>
            <span class="hover:text-slate-400 transition-colors"
              >Tailwind CSS</span
            >
            <span class="text-slate-800">•</span>
            <span class="hover:text-slate-400 transition-colors">TMDB API</span>
          </div>
        </div>

        <div
          class="mt-8 pt-6 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600"
        >
          <p class="flex items-center gap-1.5">
            © 2026 Lumina Engine. Hecho con ❤️ por
            <a
              href="https://github.com/Joseph160997/lumina-engine"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 text-slate-400 hover:text-white font-medium transition-colors duration-200 group"
            >
              <svg
                class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors duration-200"
                viewBox="0 0 19 19"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M9.356 1.85C5.05 1.85 1.57 5.356 1.57 9.694a7.84 7.84 0 0 0 5.324 7.44c.387.079.528-.168.528-.376 0-.182-.013-.805-.013-1.454-2.165.467-2.616-.935-2.616-.935-.349-.91-.864-1.143-.864-1.143-.71-.48.051-.48.051-.48.787.051 1.2.805 1.2.805.695 1.194 1.817.857 2.268.649.064-.507.27-.857.49-1.052-1.728-.182-3.545-.857-3.545-3.87 0-.857.31-1.558.8-2.104-.078-.195-.349-1 .077-2.078 0 0 .657-.208 2.14.805a7.5 7.5 0 0 1 1.946-.26c.657 0 1.328.092 1.946.26 1.483-1.013 2.14-.805 2.14-.805.426 1.078.155 1.883.078 2.078.502.546.799 1.247.799 2.104 0 3.013-1.818 3.675-3.558 3.87.284.247.528.714.528 1.454 0 1.052-.012 1.896-.012 2.156 0 .208.142.455.528.377a7.84 7.84 0 0 0 5.324-7.441c.013-4.338-3.48-7.844-7.773-7.844"
                  clip-rule="evenodd"
                />
              </svg>
              Joseph Ortega
            </a>
          </p>
          <p>
            Datos proporcionados por
            <a
              href="https://www.themoviedb.org/"
              target="_blank"
              rel="noopener noreferrer"
              class="text-amber-400 hover:text-amber-300 transition-colors font-medium"
            >
              The Movie Database
            </a>
          </p>
        </div>
      </div>
    </footer>

    <!-- ═══════════════════════════════════════════════════════════
         MODAL — para detalles de las películas.
    ═══════════════════════════════════════════════════════════ -->
    <div
      id="movie-modal"
      class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/80 backdrop-blur-sm p-4"
    >
      <div
        class="bg-slate-900 w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl shadow-2xl relative border border-slate-700"
      >
        <button
          id="modal-close"
          class="absolute top-3 right-3 z-10 p-2 rounded-full bg-slate-800/80 backdrop-blur-sm text-slate-400 hover:text-white hover:bg-red-600 transition-all duration-200 cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <div id="modal-content" class="p-6"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
